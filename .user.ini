; PHP settings for NSX Meetup on Bluehost (read by PHP for this folder and below).
; Front page images can be up to 10 MB (FRONTPAGE_IMAGE_MAX_BYTES in EVENTSettings.php).
; post_max_size must fit the image plus the rest of the form.
upload_max_filesize = 10M
post_max_size = 12M
; Resizing a large photo needs roughly 4 bytes per pixel.
memory_limit = 256M
